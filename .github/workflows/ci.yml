name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Provider calls are mocked; no API keys are needed.
      - run: python -m unittest test_target_trigger test_ai_timing test_autopilot test_api test_store test_market test_devin_timing -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/app.js
      - run: node --test test_chart.cjs test_ui.cjs
